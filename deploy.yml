name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The site is one page with anchor sections, but the nav shows real
      # paths (/services, /about...). Cloudflare Pages ignores 200-rewrites
      # in _redirects for this project, so each path needs a real file.
      # We copy index.html into a directory per section at build time —
      # that way there is still only ONE source file to edit.
      #
      # Adding a section? Add its id to SECTIONS below AND to the PATHS map
      # in the script at the bottom of index.html. Both, or the URL 404s.
      - name: Build site
        run: |
          SECTIONS="how-it-works services results case-study about faq"
          rm -rf dist && mkdir -p dist
          cp index.html contact.html dist/
          cp logo-mark.png favicon-32.png favicon-512.png apple-touch-icon.png og-image.jpg dist/
          for s in $SECTIONS; do
            mkdir -p "dist/$s"
            cp index.html "dist/$s/index.html"
          done
          find dist -type f | sort

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=branded-outreach --branch=main
